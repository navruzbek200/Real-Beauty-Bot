<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Real Beauty</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      /* Base follows the Telegram theme; the accent is a fixed dusty-rose +
         soft gold pair so the app reads as a beauty brand, not a messenger. */
      --bg: var(--tg-theme-bg-color, #16100f);
      --text: var(--tg-theme-text-color, #f6eef0);
      --hint: var(--tg-theme-hint-color, #a89a9e);
      --rose: #e07a95;
      --rose-2: #f0a8bc;
      --rose-deep: #c2537a;
      --gold: #d9b06c;
      --on-rose: #fff;
      --card: color-mix(in srgb, var(--text) 5%, var(--bg));
      --line: color-mix(in srgb, var(--text) 11%, transparent);
      --radius: 18px;
      --shadow: 0 8px 28px color-mix(in srgb, #000 25%, transparent);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; }
    body { position: relative; min-height: 100vh; overflow-x: hidden;
      background:
        radial-gradient(52% 34% at 14% 0%, color-mix(in srgb, var(--rose) 16%, transparent), transparent 62%),
        radial-gradient(46% 30% at 90% 2%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      /* room for the fixed tab bar */
      padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
    img { display: block; max-width: 100%; }
    .serif { font-family: ui-serif, "Palatino", Georgia, "Times New Roman", serif; }

    .card-bg { background: var(--card); border: 1px solid var(--line); }
    .glass { background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25);
      border: 1px solid var(--line); }

    /* ---------- hero ---------- */
    .hero { padding: calc(22px + env(safe-area-inset-top)) 20px 14px; text-align: center; }
    .hero .kicker { font-size: 10.5px; letter-spacing: .34em; text-transform: uppercase;
      color: var(--gold); font-weight: 700; }
    .hero h1 { margin: 4px 0 0; font-size: 32px; font-weight: 600; letter-spacing: .01em; }
    .hero h1 em { font-style: italic; color: var(--rose-2); }
    .hero p { margin: 6px auto 0; font-size: 13.5px; color: var(--hint); max-width: 30ch; line-height: 1.45; }
    .hero .rule { width: 44px; height: 2px; margin: 12px auto 0; border-radius: 2px;
      background: linear-gradient(90deg, var(--rose), var(--gold)); }

    /* ---------- views ---------- */
    .view { display: none; animation: fade .22s ease; }
    .view.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

    /* ---------- search + chips ---------- */
    .controls { padding: 4px 16px; }
    .search { position: relative; border-radius: 14px; margin-bottom: 10px; }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .5; }
    .search input { width: 100%; border: none; outline: none; background: transparent; color: var(--text);
      padding: 12px 14px 12px 42px; font-size: 15px; }
    .search input::placeholder { color: var(--hint); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; border-radius: 999px; padding: 8px 15px; font-size: 13px; font-weight: 600;
      cursor: pointer; color: var(--text); transition: transform .12s ease; }
    .chip:active { transform: scale(.95); }
    .chip.active { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: var(--on-rose);
      border-color: transparent; box-shadow: 0 4px 14px color-mix(in srgb, var(--rose) 40%, transparent); }

    /* ---------- product grid ---------- */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 16px 8px; }
    .card { border-radius: var(--radius); overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
      transition: transform .14s ease; animation: rise .4s both; }
    .card:active { transform: scale(.97); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .thumb-wrap { position: relative; }
    .thumb { aspect-ratio: 1/1; width: 100%; object-fit: cover;
      background: linear-gradient(150deg, color-mix(in srgb, var(--rose) 18%, transparent), color-mix(in srgb, var(--gold) 10%, transparent)); }
    div.thumb { display: flex; align-items: center; justify-content: center; font-size: 38px;
      color: var(--rose-2); font-family: ui-serif, Georgia, serif; font-style: italic; }
    .badges { position: absolute; top: 9px; left: 9px; display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 999px; letter-spacing: .02em; }
    .badge.sale { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: #fff; }
    .badge.top { background: linear-gradient(135deg, #e8c98d, var(--gold)); color: #3d2c10; }
    .card-body { padding: 11px 12px 13px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
    .name { font-size: 13.5px; font-weight: 600; line-height: 1.3; min-height: 2.6em;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .price { font-size: 15.5px; font-weight: 800; color: var(--rose-2); }
    .old { font-size: 12px; color: var(--hint); text-decoration: line-through; }
    .buy { margin-top: auto; border-radius: 11px; padding: 9px; font-size: 13px; font-weight: 700;
      background: color-mix(in srgb, var(--rose) 14%, transparent); color: var(--rose-2); cursor: pointer;
      border: 1px solid color-mix(in srgb, var(--rose) 28%, transparent); }

    /* ---------- lessons ---------- */
    .section-head { padding: 14px 20px 4px; }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .section-head p { margin: 4px 0 0; font-size: 13px; color: var(--hint); line-height: 1.45; }
    .lesson-list { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .lesson-card { border-radius: var(--radius); overflow: hidden; animation: rise .4s both; }
    .lesson-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
    .lesson-head:active { background: color-mix(in srgb, var(--text) 5%, transparent); }
    .lesson-thumb { width: 52px; height: 52px; border-radius: 13px; object-fit: cover; flex: 0 0 auto;
      background: linear-gradient(150deg, color-mix(in srgb, var(--rose) 20%, transparent), color-mix(in srgb, var(--gold) 12%, transparent)); }
    div.lesson-thumb { display: flex; align-items: center; justify-content: center; font-size: 22px;
      color: var(--rose-2); font-family: ui-serif, Georgia, serif; font-style: italic; }
    .lesson-info { flex: 1; min-width: 0; }
    .lesson-info .t { font-size: 14.5px; font-weight: 650; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lesson-info .m { margin-top: 3px; font-size: 12px; color: var(--hint); }
    .lesson-chev { color: var(--hint); transition: transform .2s ease; flex: 0 0 auto; }
    .lesson-card.open .lesson-chev { transform: rotate(90deg); }
    .steps { display: none; border-top: 1px solid var(--line); }
    .lesson-card.open .steps { display: block; }
    .step { display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer; }
    .step + .step { border-top: 1px solid var(--line); }
    .step:active { background: color-mix(in srgb, var(--text) 5%, transparent); }
    .play { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center;
      justify-content: center; background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: #fff; }
    .play.soon { background: color-mix(in srgb, var(--hint) 22%, transparent); color: var(--hint); }
    .step .s-label { flex: 1; font-size: 14px; font-weight: 550; min-width: 0; }
    .step .s-soon { font-size: 11px; color: var(--hint); flex: 0 0 auto; }
    .lesson-note { margin: 12px 20px 0; font-size: 12.5px; color: var(--hint); text-align: center; line-height: 1.5; }

    /* ---------- contact ---------- */
    .menu { border-radius: var(--radius); overflow: hidden; margin: 10px 16px 0; }
    .row { display: flex; align-items: center; gap: 13px; padding: 13px 15px; cursor: pointer; transition: background .15s ease; }
    .row:active { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .row + .row { border-top: 1px solid var(--line); }
    .ic { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto; color: #fff; }
    .ic.ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
    .ic.yt { background: #ff0000; }
    .ic.tg { background: linear-gradient(135deg,#37bbfe,#007dbb); }
    .ic.sp { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); }
    .row .label { flex: 1; font-size: 15px; font-weight: 600; }
    .row .chev { color: var(--hint); font-size: 20px; }

    /* ---------- states / skeleton ---------- */
    .state { text-align: center; color: var(--hint); padding: 48px 24px; font-size: 15px; line-height: 1.5; }
    .sk { border-radius: var(--radius); overflow: hidden; }
    .sk .thumb, .sk .bar { animation: pulse 1.3s ease-in-out infinite; }
    .sk .bar { height: 12px; margin: 12px; border-radius: 6px; background: var(--line); }
    .sk .bar.short { width: 55%; }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* ---------- detail sheet ---------- */
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none;
      transition: opacity .22s ease; z-index: 20; }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg);
      border-radius: 24px 24px 0 0; transform: translateY(101%); transition: transform .3s cubic-bezier(.2,.9,.2,1);
      max-height: 90vh; overflow-y: auto; padding-bottom: calc(20px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); }
    .sheet.open { transform: none; }
    .grab { width: 42px; height: 4px; border-radius: 2px; background: var(--hint); opacity: .4; margin: 9px auto 2px; }
    .sheet-photo { width: 100%; aspect-ratio: 1/1; object-fit: cover;
      background: linear-gradient(150deg, color-mix(in srgb, var(--rose) 18%, transparent), color-mix(in srgb, var(--gold) 10%, transparent));
      display: flex; align-items: center; justify-content: center; font-size: 58px; color: var(--rose-2);
      font-family: ui-serif, Georgia, serif; font-style: italic; }
    .sheet-body { padding: 18px 18px 6px; }
    .sheet-body h2 { margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
    .sheet-price { display: flex; align-items: baseline; gap: 9px; margin-bottom: 14px; flex-wrap: wrap; }
    .sheet-price .price { font-size: 23px; }
    .desc { color: var(--text); opacity: .86; font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
    .cta { padding: 16px 18px 4px; }
    .cta button { width: 100%; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: var(--on-rose); cursor: pointer;
      box-shadow: 0 6px 20px color-mix(in srgb, var(--rose) 38%, transparent); }
    .cta button:active { transform: scale(.98); }
    .cta .hint-line { margin: 9px 2px 0; font-size: 12px; color: var(--hint); text-align: center; }

    /* ---------- cart ---------- */
    .cartbar { position: fixed; left: 12px; right: 12px; bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 16; display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: #fff; cursor: pointer;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--rose) 45%, transparent); animation: rise .3s both; }
    .cartbar.show { display: flex; }
    .cartbar .cb-count { background: rgba(255,255,255,.22); border-radius: 999px; padding: 3px 10px;
      font-size: 13px; font-weight: 800; }
    .cartbar .cb-total { flex: 1; font-size: 15px; font-weight: 800; }
    .cartbar .cb-go { font-size: 13.5px; font-weight: 700; opacity: .95; }
    .add-cart { width: 100%; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: #fff; cursor: pointer;
      box-shadow: 0 6px 20px color-mix(in srgb, var(--rose) 38%, transparent); }
    .add-cart:active { transform: scale(.98); }
    .ask-secondary { width: 100%; margin-top: 10px; border-radius: 14px; padding: 13px; font-size: 14.5px;
      font-weight: 700; background: color-mix(in srgb, var(--rose) 12%, transparent); color: var(--rose-2);
      border: 1px solid color-mix(in srgb, var(--rose) 26%, transparent); cursor: pointer; }
    .co-body { padding: 14px 18px 6px; }
    .co-body h2 { margin: 0 0 12px; font-size: 20px; font-weight: 700; }
    .co-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .co-item .n { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
    .co-item .p { font-size: 12.5px; color: var(--hint); margin-top: 2px; }
    .stepper { display: flex; align-items: center; gap: 2px; }
    .stepper button { width: 30px; height: 30px; border: none; border-radius: 9px; font-size: 17px; font-weight: 800;
      background: color-mix(in srgb, var(--rose) 14%, transparent); color: var(--rose-2); cursor: pointer; }
    .stepper span { min-width: 26px; text-align: center; font-size: 14.5px; font-weight: 700; }
    .co-sub { display: flex; justify-content: space-between; padding: 8px 0 0; font-size: 13.5px; color: var(--hint); }
    .co-total { display: flex; justify-content: space-between; padding: 9px 0 4px; margin-top: 8px;
      border-top: 1px solid var(--line); font-size: 16px; font-weight: 800; }
    .pay-note { margin: 14px 0 0; padding: 11px 13px; border-radius: 12px; font-size: 12.5px; line-height: 1.45;
      background: color-mix(in srgb, var(--rose) 11%, transparent);
      border: 1px solid color-mix(in srgb, var(--rose) 24%, transparent); color: var(--text); }
    .dlv button .d-f { display: block; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: var(--rose-2); }
    .soon-price { font-size: 12.5px; font-weight: 600; color: var(--hint); }
    .co-label { margin: 14px 0 7px; font-size: 13px; font-weight: 700; color: var(--hint);
      text-transform: uppercase; letter-spacing: .06em; }
    .dlv { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .dlv button { border-radius: 14px; padding: 13px 10px; cursor: pointer; text-align: center;
      background: var(--card); border: 1.5px solid var(--line); color: var(--text); font: inherit; }
    .dlv button .d-ic { font-size: 22px; }
    .dlv button .d-t { display: block; margin-top: 4px; font-size: 14px; font-weight: 750; }
    .dlv button .d-s { display: block; margin-top: 2px; font-size: 11.5px; color: var(--hint); }
    .dlv button.on { border-color: var(--rose); background: color-mix(in srgb, var(--rose) 13%, transparent); }
    .dlv button.on .d-t { color: var(--rose-2); }
    .co-input { width: 100%; border: 1.5px solid var(--line); border-radius: 13px; background: var(--card);
      color: var(--text); padding: 12px 13px; font: inherit; font-size: 14.5px; outline: none; resize: none; }
    .co-input:focus { border-color: var(--rose); }
    .co-err { margin: 10px 0 0; font-size: 13px; color: #ff7b8a; font-weight: 600; display: none; }
    .co-err.show { display: block; }
    .ok-wrap { text-align: center; padding: 44px 24px 20px; }
    .ok-wrap .ok-ic { font-size: 54px; }
    .ok-wrap h2 { margin: 12px 0 6px; font-size: 21px; font-weight: 750; }
    .ok-wrap p { margin: 0 auto; max-width: 30ch; font-size: 14.5px; color: var(--hint); line-height: 1.5; }

    /* ---------- bottom tab bar ---------- */
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); gap: 6px;
      border-top: 1px solid var(--line); }
    .tab { flex: 1; border: none; background: none; color: var(--hint); font: inherit; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; border-radius: 13px;
      font-size: 11px; font-weight: 650; transition: color .15s ease, background .15s ease; }
    .tab.active { color: var(--rose-2); background: color-mix(in srgb, var(--rose) 12%, transparent); }
    .tab svg { display: block; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="kicker" id="kicker">Beauty shop</div>
    <h1 class="serif" id="shop-name">Real <em>Beauty</em></h1>
    <p id="shop-tagline">Teringizga professional g'amxo'rlik</p>
    <div class="rule"></div>
  </header>

  <!-- ============ SHOP ============ -->
  <div class="view" id="view-shop">
    <div class="controls">
      <div class="search card-bg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
        <input id="search" type="text" placeholder="Qidirish…" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div id="content"></div>
  </div>

  <!-- ============ LESSONS ============ -->
  <div class="view" id="view-lessons">
    <div class="section-head">
      <h2 id="lessons-title">🎓 Darslar</h2>
      <p id="lessons-sub"></p>
    </div>
    <div id="lessons-content"></div>
    <p class="lesson-note" id="lesson-note" hidden></p>
  </div>

  <!-- ============ CONTACT ============ -->
  <div class="view" id="view-contact">
    <div class="section-head">
      <h2 id="contact-title">Aloqa</h2>
      <p id="contact-sub"></p>
    </div>
    <div class="menu card-bg" id="links"></div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div id="sheet-content"></div>
  </div>

  <div class="cartbar" id="cartbar">
    <span class="cb-count" id="cb-count">0</span>
    <span class="cb-total" id="cb-total"></span>
    <span class="cb-go" id="cb-go">Rasmiylashtirish ›</span>
  </div>

  <nav class="tabbar glass" id="tabbar">
    <button class="tab active" data-tab="shop">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7V6a6 6 0 0 1 12 0v1"/><path d="M4 7h16l-1.2 12.1a2 2 0 0 1-2 1.9H7.2a2 2 0 0 1-2-1.9L4 7Z"/></svg>
      <span id="tab-shop">Do'kon</span>
    </button>
    <button class="tab" data-tab="lessons">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5v-7Z" fill="currentColor" stroke="none"/></svg>
      <span id="tab-lessons">Darslar</span>
    </button>
    <button class="tab" data-tab="contact">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1.1L3 20l1.1-5.3A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5Z"/></svg>
      <span id="tab-contact">Aloqa</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor && tg.setHeaderColor('bg_color'); } catch (e) {} }

    const params = new URLSearchParams(window.location.search);
    const LANG = (params.get('lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || 'uz').slice(0, 2);
    const T = {
      uz: { kicker: 'Go‘zallik do‘koni', search: 'Qidirish…', all: 'Hammasi', top: '🔥 TOP', sale: '💸 Chegirma',
        empty: 'Mahsulot topilmadi', err: 'Yuklab bo‘lmadi. Qayta urinib ko‘ring.', ask: '💬 Savol berish',
        askHint: 'Savolingiz botda — shu chatda davom etadi', badgeTop: 'TOP', som: 'so‘m', details: 'Batafsil',
        links: 'Biz bilan bog‘laning', support: 'Savol / Murojaat yozish', ig: 'Instagram', yt: 'YouTube', tgc: 'Telegram kanal',
        tabShop: 'Do‘kon', tabLessons: 'Darslar', tabContact: 'Aloqa',
        lessonsTitle: '🎓 Video darslar', lessonsMine: 'Mahsulotlaringiz bo‘yicha qo‘llanmalar', lessonsAll: 'Mahsulotlar bo‘yicha video qo‘llanmalar',
        lessonsEmpty: 'Hozircha video darslar yo‘q.\nTez orada qo‘shiladi!', lessonCount: (n) => n + ' ta dars',
        lessonNote: 'Darsni tanlasangiz, video bot chatida ochiladi 📲', soon: 'Tez orada',
        contactSub: 'Savolingiz bormi? Jamoamiz doim aloqada.',
        addCart: '🛒 Savatga qo‘shish', added: 'Savatga qo‘shildi ✓', checkout: 'Rasmiylashtirish ›',

    // ------------------------------------------------------------------

    function actInChat(payload, startParam) {
      const fromReplyKeyboard = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && !tg.initDataUnsafe.query_id);
      if (fromReplyKeyboard && tg.sendData) {

      if (BOT_USERNAME) {
        const url = 'https://t.me/' + BOT_USERNAME + '?start=' + encodeURIComponent(startParam);
        try { tg.openTelegramLink(url); } catch (e) { location.href = url; }
        try { tg.close(); } catch (e) {}
      }
    }

    // ------------------------------------------------------------------ tabs
    const VIEWS = ['shop', 'lessons', 'contact'];

    function showTab(name) {

        document.getElementById('view-' + v).classList.toggle('active', v === name);

      document.querySelectorAll('.tab').forEach(el =>

    function visible() {
      return ALL.filter(p => {
        if (FILTER === 'top' && !p.is_top) return false;
        if (FILTER === 'sale' && !p.discount_percent) return false;
        if (QUERY && !(p.name || '').toLowerCase().includes(QUERY)) return false;
        return true;
      });
    }
    function card(p, i) {
      const thumb = p.photo ? `<img class="thumb" loading="lazy" src="${esc(p.photo)}" alt="">`
        : `<div class="thumb">${esc(initial(p.name))}</div>`;
      const badges = [];
      if (p.discount_percent) badges.push(`<span class="badge sale">-${p.discount_percent}%</span>`);
      if (p.is_top) badges.push(`<span class="badge top">★ ${L.badgeTop}</span>`);
      const old = (p.old_price && p.old_price > p.price) ? `<span class="old">${money(p.old_price)}</span>` : '';
      return `<div class="card card-bg" data-id="${p.id}" style="animation-delay:${Math.min(i, 8) * 30}ms">

    }
    document.getElementById('backdrop').addEventListener('click', closeSheet);

    // ------------------------------------------------------------------ cart
    let CART = {};
    try { CART = JSON.parse(localStorage.getItem('rb_cart') || '{}') || {}; } catch (e) { CART = {}; }
    let DELIVERY = '', PAYMENTS_ON = false, FEES = { yandex: 0, bts: 0 };
    const cartSave = () => { try { localStorage.setItem('rb_cart', JSON.stringify(CART)); } catch (e) {} };
    const cartCount = () => Object.values(CART).reduce((a, b) => a + b, 0);
    function cartTotal() {
      return Object.entries(CART).reduce((sum, [id, qty]) => {
        const p = ALL.find(x => x.id === Number(id));
        return sum + (p && p.price ? p.price * qty : 0);
      }, 0);
    }
    function cartAdd(id) { CART[id] = Math.min((CART[id] || 0) + 1, 20); cartSave(); renderCartBar(); }
    function cartSet(id, qty) {
      if (qty <= 0) delete CART[id]; else CART[id] = Math.min(qty, 20);
      cartSave(); renderCartBar();
    }
    // Telegram rejects a UZS invoice outside this band, and every order is
    // paid by card — so a total outside it can't be ordered at all. Checked
    // here to fail before the round trip; the server checks it again.
    const MIN_CARD_SOM = 13000, MAX_CARD_SOM = 129800000;
    function amountOk(total) {
      return !PAYMENTS_ON || (total >= MIN_CARD_SOM && total <= MAX_CARD_SOM);
    }
    function renderCartBar() {
      const n = cartCount();
      document.getElementById('cartbar').classList.toggle('show', n > 0);

        document.getElementById('cb-count').textContent = n;

      if (!entries.length) { renderCartBar(); return; }
      document.getElementById('sheet-content').innerHTML = `

    function coError(text) {
      const el = document.getElementById('co-err');

      const address = document.getElementById('co-address').value.trim();

      if (address.length < 5) { coError(L.needAddress); return; }
      if (!amountOk(cartTotal() + deliveryFee())) { coError(L.errAmount); return; }
      const initData = (tg && tg.initData) ? tg.initData : '';
      if (!initData) { coError(L.errAuth); return; }

      const steps = (p.steps || []).map(s => {
        const icon = s.has_video
          ? `<span class="play"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg></span>`
          : `<span class="play soon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>`;
        const soon = s.has_video ? '' : `<span class="s-soon">${L.soon}</span>`;
        return `<div class="step" data-step="${s.id}">${icon}<span class="s-label">${esc(s.label)}</span>${soon}</div>`;
      }).join('');
      return `<div class="lesson-card card-bg" style="animation-delay:${Math.min(i, 8) * 30}ms">
        <div class="lesson-head">${thumb}
          <div class="lesson-info"><div class="t">${esc(p.name)}</div><div class="m">${L.lessonCount((p.steps || []).length)}</div></div>
          <svg class="lesson-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
        </div>
        <div class="steps">${steps}</div>
      </div>`;
    }
    function loadLessons() {
      lessonsLoaded = true;
      skeleton('lessons-content');
      const initData = (tg && tg.initData) ? tg.initData : '';
      fetch('/api/v1/webapp/lessons/?lang=' + encodeURIComponent(LANG) + (initData ? '&init_data=' + encodeURIComponent(initData) : ''))
        .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(data => {
          if (data.bot_username) BOT_USERNAME = data.bot_username;
          const c = document.getElementById('lessons-content');
          const items = data.products || [];
          set('lessons-sub', data.personalized ? L.lessonsMine : L.lessonsAll);
          if (!items.length) {
            c.innerHTML = `<div class="state">${L.lessonsEmpty.replace('\n', '<br>')}</div>`;
            return;
          }
          c.innerHTML = `<div class="lesson-list">${items.map(lessonCard).join('')}</div>`;
          const note = document.getElementById('lesson-note');
          note.textContent = L.lessonNote; note.hidden = false;
          c.querySelectorAll('.lesson-head').forEach(el => el.addEventListener('click', () => {
            haptic('light'); el.parentElement.classList.toggle('open');
          }));
          c.querySelectorAll('.step').forEach(el => el.addEventListener('click', () => {
            haptic('medium');
            actInChat({ action: 'lesson', id: Number(el.dataset.step) }, 'lesson_' + el.dataset.step);
          }));
        })
        .catch(() => { document.getElementById('lessons-content').innerHTML = `<div class="state">${L.err}</div>`; });
    }

    // ---------------------------------------------------------------- contact
    const ICONS = {
      instagram: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
      youtube: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.4-.4-5a2.6 2.6 0 0 0-1.8-1.8C19 4.8 12 4.8 12 4.8s-7 0-8.8.4A2.6 2.6 0 0 0 1.4 7C1 8.6 1 12 1 12s0 3.4.4 5a2.6 2.6 0 0 0 1.8 1.8c1.8.4 8.8.4 8.8.4s7 0 8.8-.4A2.6 2.6 0 0 0 22.6 17c.4-1.6.4-5 .4-5ZM10 15.5v-7l6 3.5-6 3.5Z"/></svg>',
      telegram: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-4.9L18 6.5c.4-.3-.1-.5-.6-.2L6.6 13.2l-4.7-1.5c-1-.3-1-1 .2-1.5L20.6 3c.9-.3 1.6.2 1.3 1.3Z"/></svg>',
      support: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1.1L3 20l1.1-5.3A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5Z"/></svg>',
    };
    function renderLinks(links) {
      const rows = [], map = { instagram: ['ig', L.ig], youtube: ['yt', L.yt], telegram: ['tg', L.tgc] };
      rows.push(`<div class="row" data-support="1"><div class="ic sp">${ICONS.support}</div><span class="label">${L.support}</span><span class="chev">›</span></div>`);
      links.forEach(l => {
        const m = map[l.kind]; if (!m) return;
        rows.push(`<div class="row" data-url="${esc(l.url)}"><div class="ic ${m[0]}">${ICONS[l.kind]}</div><span class="label">${m[1]}</span><span class="chev">›</span></div>`);
      });
      document.getElementById('links').innerHTML = rows.join('');
      document.querySelectorAll('#links .row').forEach(el => el.addEventListener('click', () => {
        haptic('light');
        if (el.dataset.support) actInChat({ action: 'support' }, 'support'); else openUrl(el.dataset.url);
      }));
    }

    // ------------------------------------------------------------------ boot
    skeleton('content'); renderChips();
    fetch('/api/v1/webapp/catalog/?lang=' + encodeURIComponent(LANG))
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(data => {
        ALL = data.products || [];
        if (data.bot_username) BOT_USERNAME = data.bot_username;
        PAYMENTS_ON = !!data.payments_enabled;
        if (data.delivery_fees) FEES = data.delivery_fees;
        if (data.shop && data.shop.name) {
          const parts = data.shop.name.trim().split(/\s+/);
          document.getElementById('shop-name').innerHTML = parts.length > 1
            ? esc(parts.slice(0, -1).join(' ')) + ' <em>' + esc(parts[parts.length - 1]) + '</em>'
            : esc(data.shop.name);
          if (data.shop.tagline) set('shop-tagline', data.shop.tagline);
        }
        ALL.length ? renderGrid() : (document.getElementById('content').innerHTML = `<div class="state">${L.empty}</div>`);
        renderLinks(data.links || []);
        renderCartBar(); // totals need prices, which just arrived
      })
      .catch(() => { document.getElementById('content').innerHTML = `<div class="state">${L.err}</div>`; });

    // Deep entry: ?tab=lessons opens the Darslar tab straight away.
    showTab(params.get('tab') || 'shop');
    renderCartBar();
  </script>
</body>
</html>
